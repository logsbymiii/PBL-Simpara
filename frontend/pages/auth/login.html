<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk | SIMPARA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/variable.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/pages/auth.css">
</head>

<body>
    <div class="auth-center">
        <div class="auth-card">
            <div class="brand-top">
                <img src="../../assets/images/logo-hmti.png" alt="Logo HMTI">
                <h2>SIMPARA</h2>
                <p>Sistem Informasi Manajemen<br>Peminjaman dan Pengembalian Barang</p>
            </div>

            <div class="tabs">
                <button type="button" class="tab active" data-role="peminjam">Peminjam</button>
                <button type="button" class="tab" data-role="admin">Admin</button>
            </div>

            <p class="error" id="error"></p>

            <!-- Form Peminjam -->
            <form id="formPeminjam">
                <div class="form-group"><label>NIM</label>
                    <input type="text" id="nim" placeholder="Masukkan NIM" required>
                </div>
                <div class="form-group"><label>Email</label>
                    <input type="email" id="email" placeholder="Masukkan email" required>
                </div>
                <div class="form-group"><label>Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="pwPeminjam" placeholder="Masukkan password" required>
                        <button type="button" class="eye" data-target="pwPeminjam" aria-label="Lihat password"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-yellow">Masuk</button>
                <p class="switch" id="linkDaftar">Belum punya akun? <a href="register.html">daftar disini.</a></p>
            </form>

            <!-- Form Admin -->
            <form id="formAdmin" class="hidden">
                <div class="form-group"><label>Username</label>
                    <input type="text" id="username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group"><label>Password</label>
                    <div class="pw-wrap">
                        <input type="password" id="pwAdmin" placeholder="Masukkan password" required>
                        <button type="button" class="eye" data-target="pwAdmin" aria-label="Lihat password"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-yellow">Masuk</button>
            </form>
        </div>
    </div>

    <script src="../../js/data/dummy.js"></script>
    <script src="../../js/utils/auth.js"></script>
    <script src="../../js/pages/login.js"></script>
</body>

</html>
