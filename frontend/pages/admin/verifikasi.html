<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi | SIMPARA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/variable.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <h1>Verifikasi Pengajuan</h1>
                <p class="sub">Tinjau pengajuan yang menunggu persetujuan, lalu setujui atau tolak. Saat ini: <b id="jumlah">0</b> pengajuan.</p>

                <div class="card">
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Peminjam</th>
                                <th>Barang &amp; Jumlah</th>
                                <th>Tanggal</th>
                                <th>Keperluan</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div class="modal" id="modal">
        <form class="modal-box" id="formTolak">
            <h3>Tolak Pengajuan</h3>
            <p class="meta" id="modalInfo"></p>
            <div class="form-group"><label>Alasan Penolakan *</label>
                <textarea id="alasan" placeholder="Tuliskan alasan penolakan, misalnya stok sedang dipakai kegiatan lain..." required></textarea>
            </div>
            <p class="hint">Alasan akan terlihat oleh peminjam di halaman riwayat.</p>
            <div class="actions">
                <button type="button" class="btn btn-gray" id="btnBatal">Batal</button>
                <button type="submit" class="btn btn-danger">Tolak Pengajuan</button>
            </div>
        </form>
    </div>

    <script src="../../js/data/dummy.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script src="../../js/utils/auth.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/topbar.js"></script>
    <script src="../../js/pages/verifikasi.js"></script>
</body>

</html>
