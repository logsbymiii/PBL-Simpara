<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Barang | SIMPARA</title>
    <link rel="stylesheet" href="../../css/variable.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/pages/barang.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <h1>Data Barang</h1>
                <p class="sub">Kelola data barang inventaris HMTI.</p>

                <div class="stats">
                    <div class="stat">
                        <div class="num" id="statTotal">0</div>
                        <div class="label">Total Barang</div>
                    </div>
                    <div class="stat">
                        <div class="num" id="statTersedia">0</div>
                        <div class="label">Tersedia</div>
                    </div>
                    <div class="stat">
                        <div class="num" id="statHabis">0</div>
                        <div class="label">Stok Habis</div>
                    </div>
                </div>

                <div class="card">
                    <div class="toolbar">
                        <input type="text" id="cari" placeholder="Cari barang...">
                        <button class="btn btn-yellow" id="btnTambah">+ Tambah Barang</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Barang</th>
                                <th>Stok</th>
                                <th>Kondisi</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel"></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <div class="modal" id="modal">
        <form class="modal-box" id="formBarang">
            <h3 id="modalJudul">Tambah Barang</h3>
            <div class="form-group"><label>Nama Barang</label><input type="text" id="nama" required></div>
            <div class="row-2">
                <div class="form-group"><label>Ikon (emoji)</label><input type="text" id="icon" placeholder="📦"
                        maxlength="4"></div>
                <div class="form-group"><label>Stok</label><input type="number" id="stok" min="0" required></div>
            </div>
            <div class="form-group"><label>Kondisi</label>
                <select id="kondisi">
                    <option>Baik</option>
                    <option>Rusak Ringan</option>
                    <option>Rusak</option>
                </select>
            </div>
            <div class="actions">
                <button type="button" class="btn btn-gray" id="btnBatal">Batal</button>
                <button type="submit" class="btn btn-yellow">Simpan</button>
            </div>
        </form>
    </div>

    <script src="../../js/data/dummy.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script src="../../js/utils/auth.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/topbar.js"></script>
    <script src="../../js/pages/data-barang.js"></script>
</body>

</html>
