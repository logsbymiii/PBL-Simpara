<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pengajuan | SIMPARA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        integrity="sha384-CK2SzKma4jA5H/MXDUU7i1TqZlCFaD4T01vtyDFvPlD97JQyS+IsSh1nI2EFbpyk" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/variable.css">
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/components.css">
</head>

<body>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="main">
            <header class="topbar" id="topbar"></header>
            <main class="content">
                <div class="card form-card">
                    <h1>Ajukan Peminjaman</h1><br>
                    <form id="formAjuan">
                        <div id="errorForm"
                            style="display:none;background:#fdecea;color:#b3261e;padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px;">
                        </div>

                        <div class="form-group"><label>Nama Peminjam *</label>
                            <input type="text" id="nama" maxlength="100" placeholder="Nama lengkap peminjam" required>
                        </div>
                        <div class="row-2">
                            <div class="form-group"><label>NIM *</label>
                                <input type="text" id="nim" maxlength="20" required>
                            </div>
                            <div class="form-group"><label>No HP</label>
                                <input type="tel" id="noHp" maxlength="20" placeholder="Opsional">
                            </div>
                        </div>
                        <div class="form-group"><label>Nama Kegiatan *</label>
                            <input type="text" id="namaKegiatan" maxlength="100" required>
                        </div>
                        <div class="row-2">
                            <div class="form-group"><label>Tanggal &amp; Jam Pinjam *</label>
                                <input type="datetime-local" id="tglPinjam" required>
                            </div>
                            <div class="form-group"><label>Tanggal &amp; Jam Kembali *</label>
                                <input type="datetime-local" id="tglKembali" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="barang-row barang-head"><label>Pilih Barang *</label><label>Jumlah *</label>
                            </div>
                            <div id="daftarBarang"></div>
                            <small id="infoBarang">Isi tanggal &amp; jam pinjam dan kembali dulu untuk melihat barang
                                yang tersedia.</small><br>
                            <button type="button" class="link-btn" id="tambahBarang">+ Tambah Barang</button>
                        </div>
                        <div class="form-group"><label>Keperluan *</label>
                            <textarea id="keperluan" maxlength="1000" placeholder="Tuliskan keperluan peminjaman..."
                                required></textarea>
                        </div>
                        <div class="actions">
                            <a href="daftar-barang.html" class="btn btn-gray">Batal</a>
                            <button type="submit" class="btn btn-yellow">Ajukan</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    
    <script src="../../js/components/ui.js"></script>
    <script src="../../js/services/api.js"></script>
    <script src="../../js/data/dummy.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script src="../../js/utils/auth.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/topbar.js"></script>
    <script src="../../js/pages/pengajuan.js"></script>
</body>

</html>
