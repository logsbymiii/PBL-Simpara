<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    PassEnv APP_ENV DB_HOST DB_PORT DB_NAME DB_USER DB_PASS DB_SSLMODE CORS_ORIGIN
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>